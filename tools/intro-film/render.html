<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Archivo"; src: url(archivo.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: "Manrope"; src: url(manrope.woff2) format("woff2"); font-weight: 200 800; }
html, body { margin: 0; background: #000; }
</style></head>
<body><canvas id="c"></canvas>
<script>
// Synkro intro film. renderFrame(t) draws the frame at t seconds; the film is LEN seconds and loops.
const LEN = 8.6;
const V1 = "#5443d8", V2 = "#8b7dff", BG = "#050508";
const canvas = document.getElementById("c");
let ctx = canvas.getContext("2d");               // swapped while a layer is drawn offscreen
let W, H, M;                                   // M: the shorter side, for layouts that work in both shapes

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (t) => 1 - Math.pow(1 - clamp(t), 3);
const easeIO = (t) => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };

// ---- Shared pieces ----
// The headline, as on the homepage: "Sync" in white above the word in violet. "Sync" stays put
// while the word changes, rising into place. One size for every word, set by the widest.
const WIDEST = "Streaming";
function headline(text, since, total) {             // since: seconds since this word; total: into the film
  ctx.font = "900 100px Archivo";
  const size = Math.min(M * .17, 100 * (W * .8) / ctx.measureText(WIDEST).width);
  const p = ease(since / .35);
  // A soft dark pool behind the words keeps them legible on bright shots without dimming the frame.
  ctx.save();
  ctx.globalAlpha = ease(total / .25);
  ctx.translate(W / 2, H / 2); ctx.scale(1, .55);
  const pool = ctx.createRadialGradient(0, 0, 0, 0, 0, size * 3.2);
  pool.addColorStop(0, "rgba(5,5,8,.5)"); pool.addColorStop(.6, "rgba(5,5,8,.22)"); pool.addColorStop(1, "rgba(5,5,8,0)");
  ctx.fillStyle = pool; ctx.fillRect(-size * 3.2, -size * 3.2, size * 6.4, size * 6.4);
  ctx.restore();
  ctx.save();
  ctx.font = `900 ${size}px Archivo`; ctx.textBaseline = "middle"; ctx.textAlign = "center";
  ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = size * .3; ctx.shadowOffsetY = size * .03;
  ctx.globalAlpha = ease(total / .25); ctx.fillStyle = "#fff";
  ctx.fillText("Sync", W / 2, H / 2 - size * .5);
  ctx.globalAlpha = p; ctx.fillStyle = V2; ctx.filter = `blur(${(1 - p) * 8 * (M / 1080)}px)`;
  ctx.fillText(text, W / 2, H / 2 + size * .55 + (1 - p) * size * .35);
  ctx.restore();
}

// ---- Scenes ----
// The categories, one second each. `clip` names graded footage in footage/frames/ and `dim` how
// far it is darkened under the word.
const CATS = [
  { word: "Film", clip: "film", dim: 0 }, { word: "TV", clip: "tv", dim: 0 }, { word: "Ads", clip: "ads", dim: 0 },
  { word: "Trailers", clip: "trailers", dim: 0 }, { word: "Games", clip: "games", dim: 0 }, { word: "Streaming", clip: "streaming", dim: 0 },
];
const CAT_LEN = 1, TR = .25;                    // seconds per category, and per transition
const layerA = document.createElement("canvas"), layerB = document.createElement("canvas");
function drawTo(layer, fn) {
  const main = ctx;
  ctx = layer.getContext("2d");
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  fn();
  ctx = main;
}
function catBackground(i, t) {                    // t: seconds into this category
  const c = CATS[i];
  footage(c.clip, t, c.dim ?? .45, .05 * t);
}
function sceneCategories(t) {
  const i = Math.min(CATS.length - 1, Math.floor(t / CAT_LEN)), local = t - i * CAT_LEN;
  if (i > 0 && local < TR) {
    // Zoom through: the last shot pushes in and blurs away as the next settles into place.
    const p = easeIO(local / TR), blur = Math.sin(Math.PI * p) * 10 * (M / 1080);
    drawTo(layerA, () => catBackground(i - 1, CAT_LEN + local));
    drawTo(layerB, () => catBackground(i, local));
    ctx.save(); ctx.filter = `blur(${blur}px)`; ctx.translate(W / 2, H / 2);
    ctx.save(); ctx.scale(1 + .18 * p, 1 + .18 * p); ctx.drawImage(layerA, -W / 2, -H / 2); ctx.restore();
    ctx.globalAlpha = p; ctx.scale(1.15 - .15 * p, 1.15 - .15 * p); ctx.drawImage(layerB, -W / 2, -H / 2);
    ctx.restore();
  } else catBackground(i, local);
  headline(CATS[i].word, local, t);
}

// Graded footage frames, by clip name (see prepare-footage.sh).
const CLIPS = {}, FOOT_FPS = 30;
async function loadClip(name, shape) {
  const frames = CLIPS[name] = [];
  for (let i = 1; ; i++) {
    // Wait for the file, not for decode(): decode() is refused once many frames are held decoded,
    // while a loaded image is decoded when drawn and can be dropped again.
    const img = new Image();
    const ok = await new Promise((done) => { img.onload = () => done(true); img.onerror = () => done(false); img.src = `footage/frames/${name}/${shape}/${String(i).padStart(3, "0")}.jpg`; });
    if (!ok) break;                                // past the last frame
    frames.push(img);
  }
}
function footage(name, t, dim, push) {            // t: seconds into the clip; push: zoom beyond 1
  const frames = CLIPS[name] ?? [], f = frames[Math.min(frames.length - 1, Math.floor(t * FOOT_FPS))];
  if (!f) return;
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(1 + push, 1 + push);
  ctx.drawImage(f, -W / 2, -H / 2, W, H); ctx.restore();
  ctx.fillStyle = `rgba(5,5,8,${dim})`; ctx.fillRect(0, 0, W, H);
}

// Sync Anything plays over the music shot: the overhead guitar, headphones, cassettes and record player.
const MUSIC_LEN = 2.6;                            // seconds of the music shot
function music(t) { footage("flatlay", t, .08, .04 * t / MUSIC_LEN); }

function sceneEnd(t, total) {                      // Sync Anything over the music shot, to the last frame
  music(t);
  headline("Anything", t, total);
}

// ---- Timeline ----
// 0 Sync Film … Sync Streaming · 6 Sync Anything, over the music shot
const CUTS = [0, 6];
function renderFrame(t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.letterSpacing = "0px";
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  if (t < 6) sceneCategories(t);
  else sceneEnd(t - 6, t);
  // Flash on the cuts.
  for (const cut of CUTS) { const d = t - cut; if (d >= 0 && d < .12) { ctx.fillStyle = `rgba(160,150,255,${.5 * (1 - d / .12)})`; ctx.fillRect(0, 0, W, H); } }
  // Vignette.
  const v = ctx.createRadialGradient(W / 2, H / 2, M * .35, W / 2, H / 2, Math.hypot(W, H) * .6);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.15)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
}

window.setup = async (w, h) => {
  W = canvas.width = w; H = canvas.height = h; M = Math.min(w, h);
  await document.fonts.load("900 100px Archivo"); await document.fonts.ready;
  layerA.width = layerB.width = w; layerA.height = layerB.height = h;
  const shape = W > H ? "landscape" : "portrait";
  for (const name of ["flatlay", ...CATS.map((c) => c.clip)]) await loadClip(name, shape);
};
window.LEN = LEN;
window.frame = (t) => { renderFrame(t); return canvas.toDataURL("image/jpeg", 0.95); };
</script>
</body></html>
