<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face { font-family: "Archivo"; src: url(archivo.woff2) format("woff2"); font-weight: 100 900; font-stretch: 62% 125%; }
@font-face { font-family: "Manrope"; src: url(manrope.woff2) format("woff2"); font-weight: 200 800; }
html, body { margin: 0; background: #000; }
</style></head>
<body><canvas id="c"></canvas>
<script>
// Synkro intro film. renderFrame(t) draws the frame at t seconds; the film is LEN seconds and loops.
const LEN = 14.4, BEAT = 0.5;
const V1 = "#5443d8", V2 = "#8b7dff", BG = "#050508";
const canvas = document.getElementById("c");
let ctx = canvas.getContext("2d");               // swapped while a layer is drawn offscreen
let W, H, M;                                   // M: the shorter side, for layouts that work in both shapes

const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const ease = (t) => 1 - Math.pow(1 - clamp(t), 3);
const easeIO = (t) => { t = clamp(t); return t < .5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; };
const kick = (t) => Math.exp(-((t % BEAT) / BEAT) * 6);  // 1 on each beat, decaying

let seed = 11; const rand = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);

// ---- Prebuilt textures ----
const grains = [];
function buildTextures() {
  for (let g = 0; g < 6; g++) {
    const c = document.createElement("canvas"); c.width = c.height = 256;
    const d = c.getContext("2d"), img = d.createImageData(256, 256);
    for (let i = 0; i < img.data.length; i += 4) { const v = rand() * 255; img.data[i] = img.data[i + 1] = img.data[i + 2] = v; img.data[i + 3] = 10; }
    d.putImageData(img, 0, 0); grains.push(c);
  }
}

// ---- Shared pieces ----
function glow(x, y, r, a, color = "84,67,216") {
  const g = ctx.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${color},${a})`); g.addColorStop(1, `rgba(${color},0)`);
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
}
function wave(t, amp, alpha, y = H / 2) {
  for (const [w, a, col] of [[10, .12, V1], [3, .5, V2], [1.4, 1, "#fff"]]) {
    ctx.strokeStyle = col; ctx.globalAlpha = alpha * a; ctx.lineWidth = w * (M / 1080);
    ctx.beginPath();
    for (let x = 0; x <= W; x += 4) {
      const u = x / W, env = Math.sin(Math.PI * u);
      const y2 = y + amp * env * (Math.sin(u * 22 + t * 6) * .55 + Math.sin(u * 51 - t * 9) * .3 + Math.sin(u * 7 + t * 2) * .15);
      x === 0 ? ctx.moveTo(x, y2) : ctx.lineTo(x, y2);
    }
    ctx.stroke();
  }
  ctx.globalAlpha = 1;
}
function word(text, size, alpha, scale, y = H / 2) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(W / 2, y); ctx.scale(scale, scale);
  ctx.font = `900 ${size}px Archivo`; ctx.textBaseline = "middle"; ctx.textAlign = "center"; ctx.fillStyle = "#fff";
  ctx.shadowColor = "rgba(0,0,0,.55)"; ctx.shadowBlur = size * .25; ctx.shadowOffsetY = size * .03;
  ctx.fillText(text, 0, 0);
  ctx.restore();
}
function fitSize(text, max) { ctx.font = `900 100px Archivo`; return Math.min(max, 100 * (W * .82) / ctx.measureText(text).width); }

// ---- Scenes ----
function sceneLine(t, k) {                       // a waveform wakes up on the beat
  glow(W / 2, H / 2, M * .7, .18 + .2 * k);
  wave(t, M * .14 * ease(t / 1.6) * (.6 + .4 * k), clamp(t / .4));
}

// The categories, one second each. `clip` names graded footage in footage/frames/ and `dim` how
// far it is darkened under the word (already-dark shots need less); a category without footage
// gets its drawn backdrop.
const CATS = [
  { word: "Film", clip: "film", dim: 0 }, { word: "TV", clip: "tv", dim: 0 }, { word: "Ads", clip: "ads", dim: .12 },
  { word: "Trailers", clip: "trailers", dim: .1 }, { word: "Games", clip: "games", dim: 0 }, { word: "Streaming", clip: "streaming", dim: 0 },
];
function backdrop(i, u, t) {                      // u: 0..1 through this word
  const cx = W / 2, cy = H / 2;
  ctx.save();
  if (i === 0) {                                  // rings rushing out
    for (let n = 0; n < 9; n++) { const r = ((n / 9 + u * .5) % 1) * M * 1.1; ctx.strokeStyle = `rgba(139,125,255,${.5 * (1 - r / (M * 1.1))})`; ctx.lineWidth = 2; ctx.beginPath(); ctx.arc(cx, cy, r, 0, 7); ctx.stroke(); }
  } else if (i === 1) {                           // diagonal light streaks
    ctx.translate(cx, cy); ctx.rotate(-.5);
    for (let n = 0; n < 14; n++) { const x = ((n * 173) % 1000 / 1000 - .5) * W * 2 + u * W * .6; const g = ctx.createLinearGradient(x - 300, 0, x + 300, 0); g.addColorStop(0, "rgba(84,67,216,0)"); g.addColorStop(.5, `rgba(139,125,255,${.15 + (n % 3) * .08})`); g.addColorStop(1, "rgba(84,67,216,0)"); ctx.fillStyle = g; ctx.fillRect(x - 300, -H * 1.5, 600, H * 3); }
  } else if (i === 2) {                           // dot grid breathing
    const s = M / 18;
    for (let x = s / 2; x < W; x += s) for (let y = s / 2; y < H; y += s) { const d = Math.hypot(x - cx, y - cy) / M; const p = Math.sin(d * 9 - u * 9) * .5 + .5; ctx.fillStyle = `rgba(139,125,255,${.08 + .5 * p * (1 - d * .8)})`; ctx.beginPath(); ctx.arc(x, y, 1.5 + 2.5 * p, 0, 7); ctx.fill(); }
  } else if (i === 3) {                           // vertical bars sweeping
    const n = 40; for (let k = 0; k < n; k++) { const h = (Math.sin(k * .7 + u * 10) * .5 + .5) * H * .9; ctx.fillStyle = `rgba(84,67,216,${.18 + .2 * (k % 2)})`; ctx.fillRect(k * W / n + 2, (H - h) / 2, W / n - 4, h); }
  } else if (i === 4) {                           // rotating sunburst
    ctx.translate(cx, cy); ctx.rotate(u * .6);
    for (let k = 0; k < 24; k++) { ctx.rotate(Math.PI / 12); ctx.fillStyle = k % 2 ? "rgba(84,67,216,.22)" : "rgba(139,125,255,.08)"; ctx.beginPath(); ctx.moveTo(0, 0); ctx.lineTo(M * 1.6, -M * .13); ctx.lineTo(M * 1.6, M * .13); ctx.fill(); }
  } else {                                        // scanlines scrolling
    for (let y = -40; y < H + 40; y += 14) { const yy = y + (u * 140) % 14; ctx.fillStyle = `rgba(139,125,255,${.06 + .1 * Math.sin(yy / H * Math.PI)})`; ctx.fillRect(0, yy, W, 3); }
  }
  ctx.restore();
  glow(cx, cy, M * .65, .35);
}
const CAT_LEN = 1, TR = .25;                    // seconds per category, and per transition
const layerA = document.createElement("canvas"), layerB = document.createElement("canvas");
function drawTo(layer, fn) {
  const main = ctx;
  ctx = layer.getContext("2d");
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  fn();
  ctx = main;
}
function catBackground(i, t) {                    // t: seconds into this category
  const c = CATS[i];
  if (c.clip && CLIPS[c.clip]?.length) { footage(c.clip, t, c.dim ?? .45, .05 * t); glow(W / 2, H / 2, M * .6, .2); }
  else backdrop(i, t / CAT_LEN, t);
}
function sceneCategories(t) {
  const i = Math.min(CATS.length - 1, Math.floor(t / CAT_LEN)), local = t - i * CAT_LEN;
  if (i > 0 && local < TR) {
    // Zoom through: the last shot pushes in and blurs away as the next settles into place.
    const p = easeIO(local / TR), blur = Math.sin(Math.PI * p) * 10 * (M / 1080);
    drawTo(layerA, () => catBackground(i - 1, CAT_LEN + local));
    drawTo(layerB, () => catBackground(i, local));
    ctx.save(); ctx.filter = `blur(${blur}px)`; ctx.translate(W / 2, H / 2);
    ctx.save(); ctx.scale(1 + .18 * p, 1 + .18 * p); ctx.drawImage(layerA, -W / 2, -H / 2); ctx.restore();
    ctx.globalAlpha = p; ctx.scale(1.15 - .15 * p, 1.15 - .15 * p); ctx.drawImage(layerB, -W / 2, -H / 2);
    ctx.restore();
  } else catBackground(i, local);
  const size = fitSize(CATS[i].word, M * .34);
  word(CATS[i].word, size, ease(local / .12), 1.12 - .12 * ease(local / .35));
}

function bars(t, collapse) {                      // a wall of sound bars on the beat
  const n = W > H ? 56 : 28, gap = W / n, k = kick(t);
  const floor = H * .72;
  for (let i = 0; i < n; i++) {
    const u = i / n;
    let h = (Math.sin(u * 13 + t * 5) * .5 + .5) * .5 + (Math.sin(u * 31 - t * 8) * .5 + .5) * .3 + .2 * k * (1 - Math.abs(u - .5) * 2);
    h *= H * .55 * (1 - collapse);
    const x = i * gap + gap * .18, w = gap * .64;
    const g = ctx.createLinearGradient(0, floor - h, 0, floor);
    g.addColorStop(0, V2); g.addColorStop(1, V1);
    ctx.fillStyle = g; ctx.fillRect(x, floor - h, w, Math.max(2, h));
    ctx.globalAlpha = .18; ctx.fillRect(x, floor + 6, w, h * .35); ctx.globalAlpha = 1;  // reflection
  }
  glow(W / 2, floor, M * .8, .25 + .25 * k);
}
// Lines of text whose words rise in one after another; `hl` holds the indexes of violet words.
// `out` (0..1) fades the whole statement away.
function statement(lines, t, maxSize, hl = [], y = H / 2, out = 0) {
  ctx.font = "900 100px Archivo";
  const widest = Math.max(...lines.map((l) => ctx.measureText(l).width));
  const size = Math.min(maxSize, 100 * (W * .84) / widest), lh = size * 1.04;
  const top = y - ((lines.length - 1) * lh) / 2 - out * M * .03;
  ctx.font = `900 ${size}px Archivo`; ctx.textBaseline = "middle"; ctx.textAlign = "left";
  const space = ctx.measureText(" ").width;
  let n = 0;
  lines.forEach((line, li) => {
    let x = W / 2 - ctx.measureText(line).width / 2;
    const yy = top + li * lh;
    for (const w of line.split(" ")) {
      const ww = ctx.measureText(w).width, p = ease((t - n * .07) / .45);
      ctx.save();
      ctx.beginPath(); ctx.rect(x - size * .1, yy - lh * .62, ww + size * .2, lh * 1.2); ctx.clip();
      ctx.globalAlpha = p * (1 - out);
      ctx.fillStyle = hl.includes(n) ? V2 : "#fff";
      ctx.shadowColor = "rgba(0,0,0,.6)"; ctx.shadowBlur = size * .25; ctx.shadowOffsetY = size * .03;
      ctx.fillText(w, x, yy + (1 - p) * lh * .8);
      ctx.restore();
      x += ww + space; n++;
    }
  });
}

// Graded footage frames, by clip name (see prepare-footage.sh).
const CLIPS = {}, FOOT_FPS = 30;
async function loadClip(name, shape) {
  const frames = CLIPS[name] = [];
  for (let i = 1; ; i++) {
    const img = new Image();
    img.src = `footage/frames/${name}/${shape}/${String(i).padStart(3, "0")}.jpg`;
    try { await img.decode(); frames.push(img); } catch { break; }
  }
}
function footage(name, t, dim, push) {            // t: seconds into the clip; push: zoom beyond 1
  const frames = CLIPS[name] ?? [], f = frames[Math.min(frames.length - 1, Math.floor(t * FOOT_FPS))];
  if (!f) return;
  ctx.save(); ctx.translate(W / 2, H / 2); ctx.scale(1 + push, 1 + push);
  ctx.drawImage(f, -W / 2, -H / 2, W, H); ctx.restore();
  ctx.fillStyle = `rgba(5,5,8,${dim})`; ctx.fillRect(0, 0, W, H);
}

function sceneCommon(t, d) {                      // "All of them have one thing in common"
  footage("flatlay", t, .3, .02 * t);
  statement(H > W ? ["All of them", "have one thing", "in common"] : ["All of them have", "one thing in common"], t - .1, M * .17, [], H / 2, clamp((t - (d - .3)) / .3));
}

function sceneMusic(t, d) {                       // the answer, over the same footage
  footage("flatlay", t + 1.6, .12, .02 * (t + 1.6));
  glow(W / 2, H / 2, M * .6, .3 + .2 * kick(t));
  const size = fitSize("Music", M * .42), p = ease((t - .08) / .4);
  word("Music", size, p * (1 - clamp((t - (d - .2)) / .2)), 1.25 - .25 * p);
}

// A turning globe of dots, with light arcing between places on it.
const GLOBE = [], ARCS = [];
function buildGlobe() {
  const N = 1100;
  for (let i = 0; i < N; i++) { const y = 1 - 2 * (i + .5) / N, r = Math.sqrt(1 - y * y), a = i * 2.399963; GLOBE.push([Math.cos(a) * r, y, Math.sin(a) * r]); }
  for (let k = 0; k < 16; k++) ARCS.push({ a: Math.floor(rand() * N), b: Math.floor(rand() * N), at: rand() * 1 });
}
function sceneWorld(t, d) {
  const R = M * .46, cx = W / 2, cy = H / 2 + M * .04, rot = 1.2 + t * .45, tl = .38;
  const proj = ([x0, y0, z0]) => {
    const x = x0 * Math.cos(rot) - z0 * Math.sin(rot), z1 = x0 * Math.sin(rot) + z0 * Math.cos(rot);
    const y = y0 * Math.cos(tl) - z1 * Math.sin(tl), z = y0 * Math.sin(tl) + z1 * Math.cos(tl);
    return { x: cx + x * R, y: cy - y * R, z };
  };
  glow(cx, cy, R * 1.4, .3);
  const appear = ease(t / .5);
  for (const p of GLOBE) {
    const q = proj(p), f = Math.max(0, q.z);
    ctx.fillStyle = `rgba(150,138,255,${(.12 + .8 * f) * appear})`;
    ctx.beginPath(); ctx.arc(q.x, q.y, (1.6 + 2.6 * f) * (M / 1080), 0, 7); ctx.fill();
  }
  for (const arc of ARCS) {
    const pr = clamp((t - .3 - arc.at) / .7);
    if (pr <= 0) continue;
    const A = proj(GLOBE[arc.a]), B = proj(GLOBE[arc.b]);
    if (A.z < .05 || B.z < .05) continue;
    const mid = GLOBE[arc.a].map((v, i) => (v + GLOBE[arc.b][i]) / 2), len = Math.hypot(...mid);
    const C = proj(mid.map((v) => (v / (len || 1)) * 1.35));
    ctx.strokeStyle = `rgba(200,192,255,${.85 * Math.min(A.z, B.z) * appear})`; ctx.lineWidth = 3 * (M / 1080);
    ctx.beginPath();
    for (let s = 0; s <= 24 * pr; s++) {
      const u = s / 24, x = (1 - u) ** 2 * A.x + 2 * (1 - u) * u * C.x + u * u * B.x, y = (1 - u) ** 2 * A.y + 2 * (1 - u) * u * C.y + u * u * B.y;
      s === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }
  glow(W / 2, H / 2, M * .5, .5, "5,5,8");
  statement(H > W ? ["We help you", "license any music,", "from anywhere", "in the world"] : ["We help you license any music,", "from anywhere in the world"], t - .15, M * .14, [7, 8, 9, 10], H / 2, clamp((t - (d - .3)) / .3));
}

function sceneEnd(t, d) {                         // Sync Anything over the bars, which melt back into the line
  const level = .38 * ease(t / .6) * (1 - easeIO((t - (d - .7)) / .5));
  bars(t, 1 - level);
  const out = clamp((t - (d - .45)) / .45);
  wave(t, M * .02, clamp((t - (d - .8)) / .3) * (1 - out));
  glow(W / 2, H / 2, M * .7, .38 * out);              // matches the first frame of the loop
  const a = ease((t - .1) / .4) * (1 - clamp((t - (d - .7)) / .3));
  const size = fitSize("Sync Anything", M * .2), ty = H * .42;
  ctx.save(); ctx.globalAlpha = a; ctx.font = `900 ${size}px Archivo`; ctx.textBaseline = "middle";
  const w1 = ctx.measureText("Sync ").width, w2 = ctx.measureText("Anything").width, x0 = W / 2 - (w1 + w2) / 2;
  const lift = (1 - ease((t - .1) / .5)) * M * .03;
  ctx.shadowColor = "rgba(0,0,0,.5)"; ctx.shadowBlur = size * .2;
  ctx.fillStyle = "#fff"; ctx.textAlign = "left"; ctx.fillText("Sync ", x0, ty + lift);
  ctx.fillStyle = V2; ctx.fillText("Anything", x0 + w1, ty + lift);
  ctx.restore();
}

// ---- Timeline ----
// 0 line · 0.6 Film…Streaming · 6.6 one thing in common · 8.2 Music · 9.4 license from anywhere · 11.4 Sync Anything
const CUTS = [.6, 6.6, 8.2, 9.4, 11.4];
function renderFrame(t, frame) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.letterSpacing = "0px";
  ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  if (t < .6) sceneLine(t + .8, kick(t));
  else if (t < 6.6) sceneCategories(t - .6);
  else if (t < 8.2) sceneCommon(t - 6.6, 1.6);
  else if (t < 9.4) sceneMusic(t - 8.2, 1.2);
  else if (t < 11.4) sceneWorld(t - 9.4, 2);
  else sceneEnd(t - 11.4, LEN - 11.4);
  // Flash on the cuts.
  for (const cut of CUTS) { const d = t - cut; if (d >= 0 && d < .12) { ctx.fillStyle = `rgba(160,150,255,${.5 * (1 - d / .12)})`; ctx.fillRect(0, 0, W, H); } }
  // Vignette and grain.
  const v = ctx.createRadialGradient(W / 2, H / 2, M * .35, W / 2, H / 2, Math.hypot(W, H) * .6);
  v.addColorStop(0, "rgba(0,0,0,0)"); v.addColorStop(1, "rgba(0,0,0,.65)");
  ctx.fillStyle = v; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = ctx.createPattern(grains[Math.floor(frame / 4) % grains.length], "repeat"); ctx.fillRect(0, 0, W, H);
}

window.setup = async (w, h) => {
  W = canvas.width = w; H = canvas.height = h; M = Math.min(w, h);
  await document.fonts.load("900 100px Archivo"); await document.fonts.ready;
  buildTextures();
  buildGlobe();
  layerA.width = layerB.width = w; layerA.height = layerB.height = h;
  const shape = W > H ? "landscape" : "portrait";
  for (const name of ["flatlay", ...CATS.map((c) => c.clip).filter(Boolean)]) await loadClip(name, shape);
};
window.LEN = LEN;
window.frame = (t, n) => { renderFrame(t, n); return canvas.toDataURL("image/jpeg", 0.93); };
</script>
</body></html>
